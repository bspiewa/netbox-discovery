[project]
name = "netbox-discovery"
version = "0.2.0"
description = "Network discovery (nmap, FortiGate) and synchronization into NetBox"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.6",
    "pynetbox>=7.9.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.scripts]
netbox-discovery = "netbox_discovery.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netbox_discovery"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "PL"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004"]
"scripts/**" = ["T201"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["netbox_discovery"]

[[tool.mypy.overrides]]
module = ["pynetbox", "pynetbox.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["netbox_discovery"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "responses>=0.26.3",
    "ruff>=0.17.6",
    "types-pyyaml>=6.0.12.20261113",
    "types-requests>=2.33.0.20261030",
]
